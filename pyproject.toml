[project]
name = "wilson-suite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "cqcparse",
]

[dependency-groups]
dev = ["pytest", "ruff", "rich"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wilson-suite"]

[tool.uv.sources]
cqcparse = { path = "../CQCParse", editable = true }
