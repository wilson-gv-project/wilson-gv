
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Gallery</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            padding: 10px;
        }
        .grid img {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="grid">

        <div>
            <img src="./svgs/big_3_False_numexpr.svg" alt="big_3_False_numexpr">
            <p>big_3_False_numexpr</p>
        </div>

        <div>
            <img src="./svgs/figfilename.svg" alt="figfilename">
            <p>figfilename</p>
        </div>

        <div>
            <img src="./svgs/figfilename22.svg" alt="figfilename22">
            <p>figfilename22</p>
        </div>

        <div>
            <img src="./svgs/figfilename22_big.svg" alt="figfilename22_big">
            <p>figfilename22_big</p>
        </div>

        <div>
            <img src="./svgs/figfilename22_big_3.svg" alt="figfilename22_big_3">
            <p>figfilename22_big_3</p>
        </div>

        <div>
            <img src="./svgs/figfilename22_big_less_1_orig.svg" alt="figfilename22_big_less_1_orig">
            <p>figfilename22_big_less_1_orig</p>
        </div>

        <div>
            <img src="./svgs/figfilename22_big_less_1_orig1.svg" alt="figfilename22_big_less_1_orig1">
            <p>figfilename22_big_less_1_orig1</p>
        </div>

        <div>
            <img src="./svgs/figfilename22_big_less_1_orig2.svg" alt="figfilename22_big_less_1_orig2">
            <p>figfilename22_big_less_1_orig2</p>
        </div>

        <div>
            <img src="./svgs/figfilename22_big_less_2.svg" alt="figfilename22_big_less_2">
            <p>figfilename22_big_less_2</p>
        </div>

        <div>
            <img src="./svgs/big_3_True.svg" alt="big_3_True">
            <p>big_3_True</p>
        </div>

    </div>
</body>
</html>
